<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleTodoApp</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer type="module"></script>
</head>
<body>
    <header>
        <h1>SimpleTodoApp</h1>
    </header>

    <section id="task-input" class="task-input">
        <input id="new-task" type="text" placeholder="What needs to be done?" autocomplete="off">
        <button id="add-task-btn">Add</button>
    </section>

    <ul id="task-list" class="task-list"></ul>

    <footer class="filters">
        <button id="filter-all">All</button>
        <button id="filter-active">Active</button>
        <button id="filter-completed">Completed</button>
    </footer>

    <footer class="credit">
        <small>Made with ❤️ by SimpleTodoApp</small>
    </footer>
</body>
</html>
